name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-css:
    name: Build CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build

      - name: Verify build output exists and is non-trivial
        run: |
          test -f assets/css/tailwind.css
          # Sanity check: a real Tailwind build is well over 1KB even after purge.
          size=$(wc -c < assets/css/tailwind.css)
          echo "Built CSS: ${size} bytes"
          test "$size" -gt 1024

      - name: Upload built CSS artifact
        uses: actions/upload-artifact@v7
        with:
          name: tailwind-css
          path: assets/css/tailwind.css
          retention-days: 7

  html-validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install htmlhint
        run: npm install -g htmlhint

      - name: Run htmlhint
        run: htmlhint "**/*.html" --ignore "node_modules/**,archive/**"

  link-check:
    name: Broken Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --cache
            --max-cache-age 1d
            --no-progress
            --exclude-path archive
            --exclude-path node_modules
            --accept 200,206,429
            './**/*.html'
          fail: false

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build-css
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build

      - name: Install http-server
        run: npm install -g http-server

      - name: Serve site
        run: |
          http-server . -p 8080 --silent &
          sleep 3

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
            http://localhost:8080/about/greeting.html
            http://localhost:8080/nextgen/gallery.html
          uploadArtifacts: true
          temporaryPublicStorage: true
